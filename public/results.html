<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Results · KDU Feedback admin</title>
<script src="/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app-header"></div>

<main id="main" class="container container--narrow page" style="max-width:920px">
  <a class="back-link" href="/admin.html"><span data-icon="arrow-left"></span> Back to forms</a>

  <div id="loading">
    <div class="skeleton" style="height:110px; margin-bottom:20px"></div>
    <div class="skeleton" style="height:96px; margin-bottom:20px"></div>
    <div class="skeleton" style="height:220px"></div>
  </div>

  <div id="error-view" hidden></div>

  <div id="results-view" hidden>
    <div class="page-head">
      <div class="page-head__text">
        <p class="eyebrow" id="status-line">Results</p>
        <h1 id="form-title"></h1>
        <p id="form-desc"></p>
      </div>
      <div class="page-head__actions">
        <button type="button" class="btn btn--secondary" id="print-btn"><span data-icon="printer"></span> Print / save PDF</button>
      </div>
    </div>

    <section class="stats" id="stats" aria-label="Summary"></section>

    <div class="alert alert--info">
      <span data-icon="shield"></span>
      <div>Responses are anonymous. Individual students are never shown, only combined results.</div>
    </div>

    <div id="summary"></div>
  </div>
</main>

<div class="viz-tooltip" id="tooltip" role="tooltip" hidden></div>

<script src="/shared/validation.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/results.js"></script>
</body>
</html>
