<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Results — Student Feedback System</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="masthead">
    <div>
      <div class="kicker"><a href="/admin.html" style="color: inherit; text-decoration: none;">&larr; Back to forms</a></div>
      <h1 id="form-title">Loading&hellip;</h1>
    </div>
  </div>

  <div id="notice" class="notice" style="display:none;"></div>
  <p id="total" class="desc" style="color: var(--slate);"></p>

  <div id="summary"></div>
</div>

<script src="/js/api.js"></script>
<script>
  const user = Auth.requireRole('admin');
  const params = new URLSearchParams(window.location.search);
  const formId = params.get('id');
  const notice = document.getElementById('notice');

  if (user && formId) load();

  async function load() {
    try {
      const { form, totalResponses, summary } = await api(`/forms/${encodeURIComponent(formId)}/responses`);
      document.getElementById('form-title').textContent = form.title;
      document.getElementById('total').textContent =
        `${totalResponses} response${totalResponses === 1 ? '' : 's'} so far. Feedback is anonymous — individual respondents are never shown.`;

      if (totalResponses === 0) {
        document.getElementById('summary').innerHTML = '<div class="empty">No responses yet.</div>';
        return;
      }

      document.getElementById('summary').innerHTML = summary.map(renderQuestion).join('');
    } catch (err) {
      showNotice(notice, err.message);
      document.getElementById('form-title').textContent = 'Unavailable';
    }
  }

  function renderQuestion(q) {
    if (q.type === 'rating') {
      const max = Math.max(1, ...q.distribution);
      const rows = [5, 4, 3, 2, 1].map(n => {
        const count = q.distribution[n - 1];
        const pct = Math.round((count / max) * 100);
        return `
          <div class="bar-row">
            <div class="bar-label">${n} star${n === 1 ? '' : 's'}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="bar-count">${count}</div>
          </div>`;
      }).join('');
      return `
        <div class="summary-block">
          <h3>${escapeHtml(q.label)}</h3>
          <div class="avg">${q.average !== null ? q.average.toFixed(2) : '—'} <span style="font-size:0.9rem; color: var(--slate); font-family: 'IBM Plex Sans', sans-serif;">/ 5 average</span></div>
          <div style="margin-top:0.6rem;">${rows}</div>
        </div>`;
    }

    if (q.type === 'choice') {
      const max = Math.max(1, ...Object.values(q.counts));
      const rows = Object.entries(q.counts).map(([opt, count]) => {
        const pct = Math.round((count / max) * 100);
        return `
          <div class="bar-row">
            <div class="bar-label" style="width: 8rem; text-align:left;">${escapeHtml(opt)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
            <div class="bar-count">${count}</div>
          </div>`;
      }).join('');
      return `
        <div class="summary-block">
          <h3>${escapeHtml(q.label)}</h3>
          ${rows}
        </div>`;
    }

    // text
    const answers = q.answers.length
      ? q.answers.map(a => `<div class="text-answer">${escapeHtml(a)}</div>`).join('')
      : '<div class="empty">No answers yet.</div>';
    return `
      <div class="summary-block">
        <h3>${escapeHtml(q.label)}</h3>
        ${answers}
      </div>`;
  }
</script>
</body>
</html>
