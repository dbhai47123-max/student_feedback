<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Feedback forms · KDU Feedback admin</title>
<script src="/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app-header"></div>

<main id="main" class="container page">

  <!-- ===================== Dashboard ===================== -->
  <div id="dashboard-view">
    <div class="page-head">
      <div class="page-head__text">
        <p class="eyebrow">Admin console</p>
        <h1>Feedback forms</h1>
        <p>Create forms, open or close them, and review anonymous results.</p>
      </div>
      <div class="page-head__actions">
        <button type="button" class="btn btn--lg" id="new-form-btn"><span data-icon="plus"></span> New form</button>
      </div>
    </div>

    <section class="stats" id="stats" aria-label="Overview"></section>

    <div class="toolbar" id="toolbar" hidden>
      <div class="toolbar__left">
        <div class="search">
          <span data-icon="search"></span>
          <label class="sr-only" for="search">Search forms</label>
          <input class="input" type="search" id="search" placeholder="Search by title or description…" autocomplete="off">
        </div>
        <div class="segmented" role="group" aria-label="Filter by status" id="filters">
          <button type="button" data-filter="all" aria-pressed="true">All</button>
          <button type="button" data-filter="open" aria-pressed="false">Open</button>
          <button type="button" data-filter="closed" aria-pressed="false">Closed</button>
        </div>
      </div>
      <div>
        <label class="sr-only" for="sort">Sort forms</label>
        <select class="select select--sm" id="sort">
          <option value="newest">Newest first</option>
          <option value="oldest">Oldest first</option>
          <option value="responses">Most responses</option>
          <option value="title">Title A–Z</option>
        </select>
      </div>
    </div>

    <section id="list" aria-live="polite" aria-busy="true">
      <div class="form-list">
        <div class="skeleton" style="height:96px"></div>
        <div class="skeleton" style="height:96px"></div>
        <div class="skeleton" style="height:96px"></div>
      </div>
    </section>
  </div>

  <!-- ===================== Builder ===================== -->
  <div id="builder-view" hidden>
    <button type="button" class="back-link link-reset" id="builder-back" style="border:0;background:none;cursor:pointer;font:inherit;padding:0">
      <span data-icon="arrow-left"></span> Back to forms
    </button>

    <div class="page-head">
      <div class="page-head__text">
        <p class="eyebrow">New form</p>
        <h1 tabindex="-1" id="builder-heading">Create a feedback form</h1>
        <p>Add a title and your questions. Students see the form as soon as you publish it.</p>
      </div>
    </div>

    <div class="template-row" id="templates">
      <span class="template-row__label"><span data-icon="sparkles"></span> Start from a template:</span>
    </div>

    <form id="builder-form" novalidate>
      <div class="card"><div class="card__body">
        <div class="field">
          <div class="label-row">
            <label class="label" for="b-title">Form title</label>
            <span class="char-count" id="b-title-count"></span>
          </div>
          <input class="input" type="text" id="b-title" maxlength="120" placeholder="e.g. Week 5 course feedback"
                 aria-describedby="b-title-error" autocomplete="off">
          <p class="field-error" id="b-title-error"></p>
        </div>
        <div class="field">
          <div class="label-row">
            <label class="label" for="b-desc">Description <span class="optional">(optional)</span></label>
            <span class="char-count" id="b-desc-count"></span>
          </div>
          <textarea class="textarea" id="b-desc" maxlength="500" rows="3"
                    placeholder="Tell students what this feedback is for and how it will be used."
                    aria-describedby="b-desc-error"></textarea>
          <p class="field-error" id="b-desc-error"></p>
        </div>
      </div></div>

      <div class="builder-section__head">
        <h2 id="questions-heading">Questions</h2>
        <span class="subtle" id="questions-count"></span>
      </div>
      <p class="field-error" id="questions-error" style="margin:-6px 0 12px"></p>

      <div id="questions" aria-labelledby="questions-heading"></div>

      <div class="add-question">
        <span class="add-question__label">Add a question:</span>
        <button type="button" class="btn btn--secondary btn--sm" data-add="rating"><span data-icon="star"></span> Rating 1–5</button>
        <button type="button" class="btn btn--secondary btn--sm" data-add="choice"><span data-icon="list"></span> Multiple choice</button>
        <button type="button" class="btn btn--secondary btn--sm" data-add="text"><span data-icon="text"></span> Short answer</button>
      </div>

      <div class="builder-bar">
        <span class="builder-bar__info" id="builder-summary"></span>
        <div class="builder-bar__buttons">
          <button type="button" class="btn btn--ghost" id="builder-cancel">Cancel</button>
          <button type="submit" class="btn" id="publish-btn"><span data-icon="send"></span> Publish form</button>
        </div>
      </div>
    </form>
  </div>
</main>

<script src="/shared/validation.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/admin.js"></script>
</body>
</html>
