<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Give feedback · KDU Feedback</title>
<script src="/js/theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app-header"></div>

<main id="main" class="container container--narrow page">
  <a class="back-link" href="/student.html"><span data-icon="arrow-left"></span> Back to my forms</a>

  <div id="loading">
    <div class="skeleton" style="height:160px; margin-bottom:20px"></div>
    <div class="skeleton" style="height:150px; margin-bottom:16px"></div>
    <div class="skeleton" style="height:150px"></div>
  </div>

  <div id="state-view" hidden></div>

  <div id="form-view" hidden>
    <header class="card form-hero">
      <p class="eyebrow">Feedback form</p>
      <h1 id="form-title"></h1>
      <p class="form-hero__desc" id="form-desc"></p>
      <div class="chip-row" id="form-chips"></div>
    </header>

    <div class="progress-bar" aria-hidden="true">
      <div class="progress-bar__text"><span id="progress-text">0 of 0 answered</span><span id="progress-pct">0%</span></div>
      <div class="meter"><span id="progress-fill" style="width:0%"></span></div>
    </div>

    <form id="feedback-form" novalidate>
      <div id="questions"></div>

      <div class="form-actions">
        <p class="form-actions__note"><span data-icon="shield"></span> Anonymous: your name is never shown with your answers.</p>
        <div class="form-actions__buttons">
          <a class="btn btn--ghost" href="/student.html">Cancel</a>
          <button type="submit" class="btn btn--lg" id="submit-btn"><span data-icon="send"></span> Submit feedback</button>
        </div>
      </div>
    </form>
  </div>
</main>

<script src="/shared/validation.js"></script>
<script src="/js/api.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/pages/form.js"></script>
</body>
</html>
