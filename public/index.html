<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Feedback System</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="wrap" style="max-width: 480px;">
  <div class="masthead" style="border-bottom: none; margin-bottom: 0.5rem;">
    <div>
      <div class="kicker">Kyungdong University · Smart Computing</div>
      <h1>Student Feedback</h1>
    </div>
  </div>

  <div class="card">
    <div class="tabs">
      <button id="tab-login" class="active" onclick="setTab('login')">Log in</button>
      <button id="tab-register" onclick="setTab('register')">Register</button>
    </div>

    <div id="notice" class="notice" style="display:none;"></div>

    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" style="width:100%;">Log in</button>
    </form>

    <form id="register-form" style="display:none;">
      <div class="field">
        <label for="reg-name">Full name</label>
        <input type="text" id="reg-name" required autocomplete="name">
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input type="password" id="reg-password" required minlength="6" autocomplete="new-password">
        <div class="hint">At least 6 characters. New accounts are registered as students.</div>
      </div>
      <button type="submit" style="width:100%;">Create account</button>
    </form>
  </div>

  <footer class="note" style="text-align:center;">
    Admins: use the account provided by your course instructor.
  </footer>
</div>

<script src="/js/api.js"></script>
<script>
  const notice = document.getElementById('notice');

  function setTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('login-form').style.display = isLogin ? 'block' : 'none';
    document.getElementById('register-form').style.display = isLogin ? 'none' : 'block';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-register').classList.toggle('active', !isLogin);
    notice.style.display = 'none';
  }

  function goToDashboard(user) {
    window.location.href = user.role === 'admin' ? '/admin.html' : '/student.html';
  }

  // If already logged in, skip straight to the right dashboard.
  (function () {
    const user = Auth.getUser();
    if (user && Auth.getToken()) goToDashboard(user);
  })();

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const { token, user } = await api('/auth/login', { method: 'POST', body: { email, password } });
      Auth.setSession(token, user);
      goToDashboard(user);
    } catch (err) {
      showNotice(notice, err.message);
    }
  });

  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const { token, user } = await api('/auth/register', { method: 'POST', body: { name, email, password } });
      Auth.setSession(token, user);
      goToDashboard(user);
    } catch (err) {
      showNotice(notice, err.message);
    }
  });
</script>
</body>
</html>
